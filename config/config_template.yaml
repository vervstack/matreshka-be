app_info:
    name: matreshka-be
    version: v1.0.37
    startup_duration: 10s
data_sources:
    - resource_name: postgres
      migrations_folder: ./migrations
      host: localhost
      port: 5432
      user: matreshka
      pwd: ""
      name: matreshka
      ssl_mode: ""
servers:
    50049:
        /{FS}:
            dist: web/dist
        /{GRPC}:
            module: pkg/matreshka_be_api
            gateway: /api
        name: MASTER
environment:
    - name: pass
      type: string
      value: jj*88
