module: matreshka-ui

deps:
  - github.com/Red-Sock/protoc-gen-npm/v0.0.17
  - github.com/vervstack/Matreshka@b8cbc004c1c5008698d696608852d7d6aa794b02
generate:
  inputs:
    - git_repo:
        url: "github.com/vervstack/Matreshka"
        sub_directory: "api/grpc"
  plugins:
    - name: grpc-gateway-ts
      out: src/app/api

    - name: npm
      out: src/app/api
